<script type="text/x-dc" data-dc-script data-props='{"vinho":{"editor":"color","default":"#5B1626","options":["#5B1626","#7A2438","#2F3B52","#3F5A4C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  shade(hex, f) {
    const n = parseInt(String(hex).replace('#', ''), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(function (v) { return Math.max(0, Math.min(255, Math.round(v * f))).toString(16).padStart(2, '0'); });
    return '#' + c.join('');
  }
  renderVals() {
    const vinho = this.props.vinho ?? '#5B1626';
    return { vinho: vinho, vinhoEscuro: this.shade(vinho, 0.5) };
  }
}
</script>
